[workspace]
members = [".", "adapters/audio", "adapters/video"]
resolver = "2"

[package]
name = "evidence-intake"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local-first, defender-oriented evidence collation kernel"
license = "AGPL-3.0-or-later"
publish = false
default-run = "evidence"

[features]
default = []
# Native Windows shell. The application/controller remains platform-neutral so a
# future Linux frontend can consume the same API without pulling in Win32 code.
gui-winsafe = ["dep:winsafe"]

[lib]
name = "evidence_intake"
path = "src/lib.rs"

[[bin]]
name = "evidence"
path = "src/main.rs"

[[bin]]
name = "evidence-gui"
path = "src/bin/evidence_gui.rs"
required-features = ["gui-winsafe"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.27", features = ["gui"], optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
# The kernel is one crate over a bundled SQLite, and its hot paths are small
# functions crossing the library/binary boundary. Whole-program optimization
# with a single codegen unit lets those inline; the build is slower and nothing
# about the released binary's behavior changes.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
