[package]
name = "evidence-intake"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local-first, defender-oriented evidence collation kernel"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "evidence_intake"
path = "src/lib.rs"

[[bin]]
name = "evidence"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
# The kernel is one crate over a bundled SQLite, and its hot paths are small
# functions crossing the library/binary boundary. Whole-program optimization
# with a single codegen unit lets those inline; the build is slower and nothing
# about the released binary's behavior changes.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
