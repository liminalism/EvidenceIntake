[package]
name = "office-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Public-defender office layer: clients, matters, calendar and notes, sibling to the evidence kernel"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "office_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
