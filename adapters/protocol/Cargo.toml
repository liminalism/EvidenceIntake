[package]
name = "evidence-adapter-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Versioned local job contract shared by Evidence intake adapters and frontends"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
