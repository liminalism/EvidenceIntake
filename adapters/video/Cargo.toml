[package]
name = "evidence-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Video intake adapter: scene cuts and derived keyframes into a NormalizedBatch"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "evidence_video"
path = "src/lib.rs"

[[bin]]
name = "evidence-video"
path = "src/bin/evidence-video.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
evidence-audio = { path = "../audio" }
evidence-intake = { path = "../.." }
hex = "0.4.3"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
